name: Test start mode with optional inputs (invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in start mode with optional inputs and invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token
          yc-sa-json-credentials: '{"id":"fake-id","service_account_id":"fake-sa","created_at":"2023-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"fake-public-key","private_key":"fake-private-key"}'
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          image-id: fake-image-id
          image2-id: fake-image2-id
          disk2-size: 20GB
          disk2-type: network-ssd
          service-account-id: fake-sa-id
          zone-id: ru-central1-a
          runner-home-dir: /home/runner/actions-runner
          user: runner
          ssh-public-key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC0fake-public-key test@example.com
      - name: Assert action failed (invalid credentials should cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
