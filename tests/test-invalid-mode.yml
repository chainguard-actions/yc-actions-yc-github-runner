name: Test invalid mode fails with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: invalid-mode
          github-token: ${{ github.token }}
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          yc-iam-token: fake-iam-token
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid mode"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid mode"
