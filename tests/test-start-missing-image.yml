name: Test start mode fails without image-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          yc-iam-token: fake-iam-token
          # Intentionally omitting image-id which is required for start mode
      - name: Assert action failed due to missing image-id
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when image-id is missing for start mode"
            exit 1
          fi
          echo "PASS: action correctly failed for start mode with missing image-id"
