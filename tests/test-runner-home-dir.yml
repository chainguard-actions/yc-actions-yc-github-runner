name: Test runner-home-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test stop mode with runner-home-dir input
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: stop
          github-token: ${{ github.token }}
          yc-sa-json-credentials: '{"invalid": "credentials"}'
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          label: fake-label
          instance-id: fake-instance-id
          runner-home-dir: /home/runner/actions-runner

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials (runner-home-dir input was accepted)"
