name: Test stop mode fails without required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: stop
          github-token: ${{ github.token }}
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          yc-iam-token: fake-iam-token
          # Intentionally omitting label and instance-id which are required for stop mode
      - name: Assert action failed due to missing stop inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when label and instance-id are missing for stop mode"
            exit 1
          fi
          echo "PASS: action correctly failed for stop mode with missing required inputs"
