name: Test stop mode missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in stop mode without label and instance-id
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: stop
          github-token: ${{ github.token }}
          yc-sa-json-credentials: '{"id":"fake","service_account_id":"fake","created_at":"2024-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000000000000000000\n-----END PUBLIC KEY-----\n","private_key":"-----BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQDQ0000000000\n-----END PRIVATE KEY-----\n"}'
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          # Intentionally omitting label and instance-id to trigger validation error

      - name: Assert action failed due to missing stop inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing label and instance-id in stop mode"
            exit 1
          fi
          echo "PASS: action correctly failed when label and instance-id are missing in stop mode"
