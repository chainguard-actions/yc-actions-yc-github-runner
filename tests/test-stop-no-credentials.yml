name: Test stop mode fails without YC credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: stop
          github-token: ${{ github.token }}
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          label: fake-runner-label
          instance-id: fake-instance-id
          # Intentionally omitting all YC credentials (yc-sa-json-credentials, yc-iam-token, yc-sa-id)
      - name: Assert action failed due to missing credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no YC credentials are provided for stop mode"
            exit 1
          fi
          echo "PASS: action correctly failed for stop mode with no YC credentials"
