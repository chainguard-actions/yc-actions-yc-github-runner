name: Test start mode with SA JSON credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: start
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          yc-sa-json-credentials: '{"id":"fake-key-id","service_account_id":"fake-sa-id","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFmFoSBMzFGMFMBMFMBM\n-----END RSA PRIVATE KEY-----\n"}'
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          image-id: fake-image-id
          cores: '4'
          memory: '8GB'
          core-fraction: '50'
          disk-type: network-ssd
          disk-size: '50GB'
          zone-id: ru-central1-b
          platform-id: standard-v3
          public-ip: 'false'
          disable-update: 'true'
          retry-timeout: 'PT0S'

      - name: Assert action ran with SA JSON credentials and failed gracefully
        env:
          OUTCOME: ${{ steps.start.outcome }}
          LABEL: ${{ steps.start.outputs.label }}
          INSTANCE_ID: ${{ steps.start.outputs.instance-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "label: $LABEL"
          echo "instance-id: $INSTANCE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$LABEL" ] && [ -z "$INSTANCE_ID" ]; then
              echo "FAIL: action succeeded but produced no outputs"
              exit 1
            fi
            echo "PASS: action succeeded with label='$LABEL' instance-id='$INSTANCE_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake SA JSON credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
