name: Test start mode with custom VM configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in start mode with custom VM config
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token
          yc-sa-json-credentials: '{"id":"fake-id","service_account_id":"fake-sa","created_at":"2021-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"-----BEGIN PUBLIC KEY-----\nfake\n-----END PUBLIC KEY-----\n","private_key":"-----BEGIN PRIVATE KEY-----\nfake\n-----END PRIVATE KEY-----\n"}'
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          image-id: fake-image-id
          service-account-id: fake-sa-id
          cores: '4'
          memory: '8GB'
          core-fraction: '50'
          disk-type: network-ssd
          disk-size: '50GB'
          zone-id: ru-central1-b
          platform-id: standard-v2
          runner-version: '2.320.0'
          public-ip: 'false'
          disable-update: 'true'
      - name: Assert action failed at cloud auth (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed custom config inputs and failed at cloud auth stage"
