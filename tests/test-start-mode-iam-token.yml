name: Test start mode with IAM token authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in start mode with fake IAM token
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token
          yc-iam-token: fake-iam-token
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          cores: '2'
          memory: '2GB'
          core-fraction: '100'
          disk-type: network-ssd
          disk-size: '30GB'
          zone-id: ru-central1-a
          platform-id: standard-v3
          runner-version: '2.320.0'
          public-ip: 'false'

      - name: Assert action failed (expected with fake IAM token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake IAM token, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid IAM token"
