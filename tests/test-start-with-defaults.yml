name: Test start mode with default resource parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in start mode with explicit defaults
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token
          yc-sa-json-credentials: '{"id":"fake-id","service_account_id":"fake-sa","created_at":"2023-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"fake-public-key","private_key":"fake-private-key"}'
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          cores: '2'
          memory: '1GB'
          core-fraction: '100'
          disk-type: network-ssd
          disk-size: '30GB'
          zone-id: ru-central1-a
          public-ip: 'true'
          platform-id: standard-v3
          runner-version: '2.299.1'
      - name: Assert action failed due to invalid credentials not input validation
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed (invalid credentials, not input validation error)"
