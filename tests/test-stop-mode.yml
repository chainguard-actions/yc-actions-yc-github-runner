name: Test stop mode (fails gracefully without real credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: stop
        uses: .
        continue-on-error: true
        with:
          mode: stop
          github-token: ${{ github.token }}
          yc-iam-token: fake-iam-token
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          label: test-runner-label
          instance-id: fake-instance-id

      - name: Assert stop mode ran and failed gracefully (no real YC credentials)
        env:
          OUTCOME: ${{ steps.stop.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real YC credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
