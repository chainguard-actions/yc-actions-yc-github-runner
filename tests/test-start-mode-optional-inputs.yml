name: Test start mode with optional inputs (second disk, ssh, ttl, user)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in start mode with optional inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token
          yc-sa-json-credentials: '{"id":"fake-id","service_account_id":"fake-sa","created_at":"2021-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"-----BEGIN PUBLIC KEY-----\nfake\n-----END PUBLIC KEY-----\n","private_key":"-----BEGIN PRIVATE KEY-----\nfake\n-----END PRIVATE KEY-----\n"}'
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          image-id: fake-image-id
          service-account-id: fake-sa-id
          image2-id: fake-image2-id
          disk2-type: network-hdd
          disk2-size: 20GB
          runner-home-dir: /home/runner/actions-runner
          ssh-public-key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC fake-key test@example.com'
          user: runner
          ttl: PT2H
      - name: Assert action failed (expected with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed optional inputs and failed at cloud auth stage"
