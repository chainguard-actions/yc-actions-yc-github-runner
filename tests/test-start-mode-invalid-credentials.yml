name: Test start mode fails with invalid YC credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          yc-sa-json-credentials: '{"id":"fake-id","service_account_id":"fake-sa-id","created_at":"2023-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000000000000000000\n-----END PUBLIC KEY-----\n","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0000000000000000000000000000000000000000000000000\n-----END RSA PRIVATE KEY-----\n"}'
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          image-id: fake-image-id
          cores: '2'
          memory: '2GB'
          core-fraction: '100'
          disk-type: network-ssd
          disk-size: '30GB'
          zone-id: ru-central1-a
          platform-id: standard-v3
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid YC credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid YC credentials"
