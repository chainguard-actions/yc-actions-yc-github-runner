name: Test start mode with extended inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in start mode with extended inputs and yc-sa-id
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token
          yc-sa-id: fake-service-account-id
          folder-id: fake-folder-id
          subnet-id: fake-subnet-id
          runner-home-dir: /home/runner/actions-runner
          service-account-id: fake-vm-service-account-id
          image2-id: fake-image2-id
          disk2-size: 50GB
          disk2-type: network-ssd
          ttl: PT2H
          user: runner
          ssh-public-key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC0000000000 test@example.com

      - name: Assert action failed (expected with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
